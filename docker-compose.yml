version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: thermora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thermora
      POSTGRES_PASSWORD: thermora
      POSTGRES_DB: thermora
    ports:
      - "5432:5432"
    volumes:
      - thermora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermora -d thermora"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: thermora-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://thermora:thermora@postgres:5432/thermora
      DATABASE_URL_PSYCOPG: "dbname=thermora user=thermora password=thermora host=postgres"
      ENV: production
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost"]'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - thermora_ml_models:/app/app/ml_models

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: thermora-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  thermora_pgdata:
  thermora_ml_models:
